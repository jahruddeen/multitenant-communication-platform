
name: SMS Voice Platform CI/CD

on:

  push:

    branches:
      - main

  pull_request:

    branches:
      - main


permissions:

  contents: read


jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository

        uses: actions/checkout@v4


      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"

          cache: pip


      - name: Install Dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      - name: Compile Python Code

        run: |

          python -m compileall -q app


      - name: Run Unit Tests

        run: |

          pytest -q


  docker-build:

    needs: test

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository

        uses: actions/checkout@v4


      - name: Build Docker Image

        run: |

          docker build -t automated-sms-voice-platform:${{ github.sha }} .
